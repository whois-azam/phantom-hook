<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚠️ PhantomHook — Threat Detected</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="warning-container">
    <!-- Animated background particles -->
    <div class="particles" aria-hidden="true">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>

    <!-- Shield icon -->
    <div class="shield-icon">
      <svg viewBox="0 0 24 24" width="80" height="80" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2L3 7v5c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/>
        <path d="M12 8v5M12 16h.01" stroke-linecap="round" stroke-width="2"/>
      </svg>
    </div>

    <h1 class="title">THREAT DETECTED</h1>
    <p class="subtitle">PhantomHook has blocked this page to protect you.</p>

    <!-- Threat details card -->
    <div class="threat-card">
      <div class="threat-row">
        <span class="threat-label">Blocked URL</span>
        <span class="threat-value" id="blockedUrl">—</span>
      </div>
      <div class="threat-row">
        <span class="threat-label">Reason</span>
        <span class="threat-value threat-reason" id="blockReason">—</span>
      </div>
      <div class="threat-row">
        <span class="threat-label">ML Confidence</span>
        <span class="threat-value" id="mlScore">—</span>
      </div>
    </div>

    <!-- Safe action -->
    <button class="btn btn-safe" id="goBackBtn">
      ← Go Back to Safety
    </button>

    <!-- Dangerous bypass -->
    <div class="bypass-section">
      <p class="bypass-warning">
        ⚠️ Continuing may expose your credentials and personal data to attackers.
      </p>
      <button class="btn btn-danger" id="proceedBtn">
        Proceed Anyway (Not Recommended)
      </button>
    </div>

    <footer class="footer">
      <p>🛡️ Phantom<span class="accent">Hook</span> — Zero-Day Threat Detection Engine</p>
    </footer>
  </div>

  <script src="warning.js"></script>
</body>
</html>
